<h1>Friends list</h1>
<div class="add-friend">
  <input type="text" [(ngModel)]="newFriend" placeholder="Friend name" />
  <button (click)="addFriend()">Add friend</button>
</div>
<div class="favorite">
  <p>My favorite people are: {{ favorites.join(', ') || 'None selected' }}</p>
</div>
<div class="people">
  <app-people
    *ngFor="let person of people"
    [name]="person"
    [isFavorite]="isFavorite(person)"
    (favoriteToggled)="toggleFavorite($event)"
  ></app-people>
</div>
