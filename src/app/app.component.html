<h1>Friends list</h1>
<div class="add-friend">
  <input type="text" [(ngModel)]="newFriend" placeholder="Friend name" />
  <button (click)="addFriend()">Add friend</button>
</div>
<div class="favorite">
  <h3>My favorite people are:</h3>
  <br />
    <ul>
      @for(f of favorites; track f) {
      <li>{{ f }}</li>
      }
    </ul>
</div>

@for(p of people; track p) {
<app-people
  [person]="p"
  [isFav]="isinFav(p)"
  (addFav)="addAppFav($event)"
  (delFav)="deleteAppFav($event)"
></app-people>
}
