<h1>Friends list</h1>
<div class="add-friend">
  <input type="text" [(ngModel)]="newFriend" placeholder="Friend name" />
  <button (click)="addFriend()">Add friend</button>
</div>
<div class="favorite">
  <h2>My favorite people are:</h2>
    <ul>
      <li
      *ngFor="let f of favorite"
      >{{ f }}</li>
  </ul>
</div>
<div>
</div>
<div class="people">
  <!-- Add your people component here -->
   <app-people
    *ngFor="let p of people"
    [name]="p"
    [isFav]="isInFav(p)"
    (addFav)="addFav($event)"
    (deleteFav)="deleteFav($event)"
   ></app-people>
</div>
