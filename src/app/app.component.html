<h1>Friends list</h1>
<div class="add-friend">
  <input type="text" [(ngModel)]="newFriend" placeholder="Friend name" />
  <button (click)="addFriend()">Add friend</button>
</div>

<div class="favorite">
  <p>My favorite person is: {{ favorite }}</p>
</div>
<div class="favorites">
  <p>My favorite people are: {{favorites.join(',')}}</p>
</div>
<div class="people">
  @for (thePerson of people; track thePerson) {
  <app-people
    [myPerson]="thePerson"
    (voted)="setFavourite($event)"
    [lastVoted]="thePerson===favorite"
    (remove)="removeFriend($event)"
    [favorites]="favorites.join(',')">
  </app-people>
}
</div>
