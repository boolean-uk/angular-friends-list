<h1>Friends list</h1>
<div class="add-friend">
  <input type="text" [(ngModel)]="newFriend" placeholder="Friend name" />
  <button (click)="addFriend()">Add friend</button>
</div>
<div class="favorite">
  <p>My favorite person is: {{ favorite }}</p>
    <app-people-component *ngFor="let p of favs"
    [name]="p"
    [isFav]="isInFav(p)"
    (addFav)="addFav($event)"
    (deleteFav)="deleteFav($event)"
  ></app-people-component>
</div>
<div class="people">
  <p>My favorite person is: {{ favs }}</p>
  <app-people-component
    *ngFor="let p of people"
    [name]="p"
    [isFav]="isInFav(p)"
    (addFav)="addFav($event)"
    (deleteFav)="deleteFav($event)">
  </app-people-component>
</div>
